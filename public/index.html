<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 21l5-10 4 7 2-3 3 6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Main">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Social Hub</span></div>
      <button class="btn primary new-post" data-action="new-post">+ Create post</button>
      <a href="#planner" class="nav-item" data-view="planner">Planner</a>
      <a href="#composer" class="nav-item" data-view="composer">Composer</a>
      <a href="#media" class="nav-item" data-view="media">Media library</a>
      <a href="#accounts" class="nav-item" data-view="accounts">Accounts</a>
      <div class="rail-foot" id="mode-badge"></div>
      <a class="source-link" href="https://github.com/The-Original-Reth/social-hub" target="_blank" rel="noopener">Source code (AGPL-3.0)</a>
    </nav>

    <main class="main">
      <div id="notice" class="notice" hidden></div>

      <!-- Planner -->
      <section id="view-planner" class="view" hidden>
        <header class="toolbar">
          <div class="toolbar-group">
            <button class="btn" data-action="today">Today</button>
            <button class="btn icon" data-action="prev" aria-label="Previous">&#8249;</button>
            <button class="btn icon" data-action="next" aria-label="Next">&#8250;</button>
            <h1 id="range-label" class="range-label"></h1>
          </div>
          <div class="toolbar-group">
            <div class="filter-chips" id="network-filter" aria-label="Filter by network"></div>
            <select id="status-filter" class="select" aria-label="Filter by status">
              <option value="all">All statuses</option>
              <option value="draft">Drafts</option>
              <option value="pending_approval">Needs approval</option>
              <option value="scheduled">Scheduled</option>
              <option value="published">Published</option>
              <option value="problem">Failed / partial</option>
            </select>
            <div class="segmented" role="tablist" aria-label="Planner view">
              <button role="tab" data-mode="week">Week</button>
              <button role="tab" data-mode="month">Month</button>
              <button role="tab" data-mode="list">List</button>
            </div>
          </div>
        </header>
        <div class="planner-body">
          <div id="calendar" class="calendar"></div>
          <aside class="side-panel">
            <h2>Needs approval</h2>
            <div id="approval-list" class="mini-list"></div>
            <h2>Unscheduled drafts</h2>
            <div id="draft-list" class="mini-list"></div>
          </aside>
        </div>
      </section>

      <!-- Composer -->
      <section id="view-composer" class="view" hidden>
        <header class="toolbar">
          <h1 id="composer-title">Create post</h1>
          <div class="toolbar-group"><button class="btn" data-action="close-composer">Cancel</button></div>
        </header>
        <div class="composer">
          <form id="composer-form" class="composer-edit" autocomplete="off">
            <div class="field">
              <span class="label">Publish to</span>
              <div id="network-picker" class="network-picker"></div>
            </div>

            <div class="field">
              <div class="label-row">
                <label class="label" for="caption">Text</label>
                <span id="caption-count" class="counts"></span>
              </div>
              <div class="tabs" id="caption-tabs" role="tablist"></div>
              <textarea id="caption" rows="7" placeholder="What do you want to share?"></textarea>
              <p class="hint" id="caption-hint">This text goes to every network. Pick a network tab to write a different version for it.</p>
            </div>

            <div class="field">
              <span class="label">Media</span>
              <div id="media-slot" class="media-slot"></div>
            </div>

            <div class="field">
              <span class="label">When</span>
              <div class="when">
                <input type="date" id="sched-date" aria-label="Date">
                <input type="time" id="sched-time" aria-label="Time">
                <span class="hint" id="tz-label"></span>
              </div>
            </div>

            <ul id="problems" class="problems" aria-live="polite"></ul>

            <div class="composer-actions">
              <button type="button" class="btn" data-submit="draft">Save draft</button>
              <button type="button" class="btn" data-submit="submit">Send for approval</button>
              <span class="spacer"></span>
              <button type="button" class="btn" data-submit="now">Post now</button>
              <button type="button" class="btn primary" data-submit="schedule">Schedule</button>
            </div>
          </form>

          <section class="composer-preview" aria-label="Preview">
            <div class="tabs" id="preview-tabs" role="tablist"></div>
            <div id="preview" class="preview-stage"></div>
          </section>
        </div>
      </section>

      <!-- Media -->
      <section id="view-media" class="view" hidden>
        <header class="toolbar">
          <h1>Media library</h1>
          <label class="btn primary">Upload<input type="file" id="media-upload" accept="image/*,video/*" hidden multiple></label>
        </header>
        <div id="media-grid" class="media-grid"></div>
      </section>

      <!-- Accounts -->
      <section id="view-accounts" class="view" hidden>
        <header class="toolbar"><h1>Accounts</h1></header>
        <div id="accounts" class="accounts"></div>
      </section>
    </main>
  </div>

  <!-- Post details drawer -->
  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-label="Post details"></aside>

  <!-- Media picker -->
  <dialog id="picker" class="picker">
    <header class="toolbar"><h2>Choose media</h2>
      <div class="toolbar-group">
        <label class="btn">Upload new<input type="file" id="picker-upload" accept="image/*,video/*" hidden></label>
        <button class="btn" data-action="close-picker">Close</button>
      </div>
    </header>
    <div id="picker-grid" class="media-grid"></div>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
