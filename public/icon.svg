<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Social Hub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- soft glow behind the elf -->
    <circle cx="500" cy="560" r="400" fill="#818cf8" opacity=".35"/>

    <!-- body / tunic -->
    <path d="M250 1024 C250 790 360 700 500 700 C640 700 750 790 750 1024 Z" fill="#16a34a"/>
    <path d="M410 708 L500 790 L590 708 Z" fill="#f59e0b"/>
    <circle cx="500" cy="860" r="16" fill="#fde68a"/>
    <circle cx="500" cy="935" r="16" fill="#fde68a"/>

    <!-- ears -->
    <path d="M318 470 L196 360 L330 560 Z" fill="#f2b48b"/>
    <path d="M306 468 L226 398 L318 530 Z" fill="#e8977a"/>
    <path d="M682 470 L804 360 L670 560 Z" fill="#f2b48b"/>
    <path d="M694 468 L774 398 L682 530 Z" fill="#e8977a"/>

    <!-- head -->
    <circle cx="500" cy="500" r="190" fill="#f8c9a0"/>

    <!-- face: looking down at the phone -->
    <ellipse cx="438" cy="520" rx="22" ry="26" fill="#1f2937"/>
    <ellipse cx="566" cy="520" rx="22" ry="26" fill="#1f2937"/>
    <circle cx="446" cy="512" r="7" fill="#ffffff"/>
    <circle cx="574" cy="512" r="7" fill="#ffffff"/>
    <circle cx="400" cy="585" r="30" fill="#f59e9e" opacity=".75"/>
    <circle cx="604" cy="585" r="30" fill="#f59e9e" opacity=".75"/>
    <path d="M455 600 Q502 645 549 600" fill="none" stroke="#7c2d12" stroke-width="16" stroke-linecap="round"/>

    <!-- hat -->
    <path d="M296 430 C320 250 470 150 700 96 C640 190 690 310 706 430 Z" fill="url(#hat)"/>
    <rect x="282" y="392" width="440" height="78" rx="39" fill="#dc2626"/>
    <rect x="282" y="392" width="440" height="26" rx="13" fill="#ef4444"/>
    <circle cx="712" cy="98" r="50" fill="#fde68a"/>
    <circle cx="698" cy="84" r="16" fill="#fff7d6"/>

    <!-- phone, held up in front -->
    <g transform="rotate(-10 520 820)">
      <rect x="400" y="640" width="250" height="400" rx="40" fill="#111827"/>
      <rect x="418" y="676" width="214" height="340" rx="22" fill="#eef2ff"/>
      <rect x="490" y="656" width="70" height="10" rx="5" fill="#374151"/>
      <!-- post on screen: picture + caption lines -->
      <rect x="436" y="696" width="178" height="130" rx="14" fill="#a5b4fc"/>
      <path d="M436 800 L486 748 L522 786 L548 762 L614 820 L614 812 Q614 826 600 826 L450 826 Q436 826 436 812 Z" fill="#6366f1"/>
      <circle cx="582" cy="730" r="14" fill="#fde68a"/>
      <rect x="436" y="846" width="160" height="16" rx="8" fill="#c7d2fe"/>
      <rect x="436" y="874" width="118" height="16" rx="8" fill="#c7d2fe"/>
      <!-- post button -->
      <rect x="436" y="928" width="178" height="58" rx="29" fill="#4f46e5"/>
      <path d="M525 972 L525 946 M512 958 L525 945 L538 958" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- hands on the phone -->
    <circle cx="398" cy="900" r="44" fill="#f8c9a0"/>
    <circle cx="660" cy="880" r="44" fill="#f8c9a0"/>

    <!-- going out: hearts and a sparkle -->
    <path d="M826 600 c-26-30-74-8-60 30 c10 26 60 56 60 56 s50-30 60-56 c14-38-34-60-60-30 z" fill="#f472b6"/>
    <path d="M876 452 c-16-18-46-5-37 18 c6 16 37 34 37 34 s31-18 37-34 c9-23-21-36-37-18 z" fill="#fbcfe8"/>
    <path d="M842 230 l12 34 l34 12 l-34 12 l-12 34 l-12-34 l-34-12 l34-12 z" fill="#fde68a"/>
  </g>
</svg>
