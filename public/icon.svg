<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Social Hub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f9a62"/>
      <stop offset="1" stop-color="#3f6a3e"/>
    </linearGradient>
    <pattern id="stripes" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#f3e6d3"/>
      <rect width="32" height="64" fill="#c64b3f"/>
    </pattern>
    <clipPath id="tile"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>

  <g clip-path="url(#tile)" stroke="#3a2a22" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <rect width="1024" height="1024" fill="url(#bg)" stroke="none"/>
    <circle cx="500" cy="540" r="390" fill="#8fbb7f" opacity=".35" stroke="none"/>

    <!-- striped shirt, suspenders, bow tie -->
    <path d="M220 1040 C230 840 350 750 500 750 C650 750 770 840 780 1040 Z" fill="url(#stripes)"/>
    <path d="M380 790 L370 1040 M620 790 L630 1040" stroke="#4a3426" stroke-width="40" fill="none"/>
    <path d="M500 772 L440 742 L440 812 Z M500 772 L560 742 L560 812 Z" fill="#4f7a4a"/>
    <circle cx="500" cy="777" r="20" fill="#3f6a3e"/>

    <!-- pointed ears -->
    <path d="M364 438 C318 426 278 404 238 372 C262 438 304 500 360 546 Z" fill="#f2bf98"/>
    <path d="M356 458 C326 448 300 432 276 412 C294 456 320 492 356 522 Z" fill="#e9a283" stroke="none"/>
    <path d="M636 438 C682 426 722 404 762 372 C738 438 696 500 640 546 Z" fill="#f2bf98"/>
    <path d="M644 458 C674 448 700 432 724 412 C706 456 680 492 644 522 Z" fill="#e9a283" stroke="none"/>

    <!-- face -->
    <ellipse cx="500" cy="480" rx="152" ry="168" fill="#f6caa5"/>


    <!-- full beard and mustache -->
    <path d="M350 440 C340 570 384 708 500 752 C616 708 660 570 650 440 C632 518 604 560 566 576 C536 560 464 560 434 576 C396 560 368 518 350 440 Z" fill="#6b452f"/>
    <path d="M500 560 C468 540 424 548 404 578 C438 596 476 590 500 572 C524 590 562 596 596 578 C576 548 532 540 500 560 Z" fill="#5a3a28"/>

    <!-- eyes, brows, nose, cheeks -->
    <path d="M420 456 Q448 438 476 452 M524 452 Q552 438 580 456" fill="none" stroke="#5a3a28" stroke-width="16"/>
    <circle cx="452" cy="492" r="12" fill="#2a1d17" stroke="none"/>
    <circle cx="552" cy="492" r="12" fill="#2a1d17" stroke="none"/>
    <circle cx="414" cy="530" r="24" fill="#ea9384" opacity=".75" stroke="none"/>
    <circle cx="586" cy="530" r="24" fill="#ea9384" opacity=".75" stroke="none"/>
    <circle cx="500" cy="530" r="24" fill="#eeb08e"/>

    <!-- red hat drooping to the left, fluffy white brim, pom-pom -->
    <path d="M454 182 C380 176 300 216 248 300 C300 276 362 270 424 282 Z" fill="#c64b3f"/>
    <path d="M336 378 C336 246 420 164 532 164 C640 164 700 262 684 378 Z" fill="#c64b3f"/>
    <path d="M318 352 Q340 330 362 348 Q384 326 410 346 Q434 324 460 344 Q486 322 512 344 Q538 322 564 344 Q590 324 614 346 Q640 326 662 348 Q686 330 704 352 Q720 388 700 418 Q676 438 652 420 Q628 440 602 422 Q578 442 552 424 Q526 444 500 426 Q474 444 448 424 Q422 442 398 422 Q372 440 348 420 Q324 438 304 412 Q296 380 318 352 Z" fill="#f6efe2"/>
    <circle cx="242" cy="312" r="44" fill="#f6efe2"/>

    <!-- hair: the quiff sweeping out from under the brim on the right -->
    <path d="M628 362 C664 312 732 300 760 330 C736 330 716 340 706 356 C726 356 740 366 744 380 C712 374 682 384 662 404 Z" fill="#6b452f"/>

    <!-- phone, held up on the right -->
    <g transform="rotate(-10 660 860)">
      <rect x="548" y="660" width="232" height="380" rx="38" fill="#2a1d17"/>
      <rect x="566" y="694" width="196" height="326" rx="22" fill="#fbf6ec" stroke="none"/>
      <rect x="630" y="674" width="66" height="9" rx="4" fill="#5b4a40" stroke="none"/>
      <rect x="582" y="712" width="164" height="120" rx="14" fill="#a9cf98" stroke="none"/>
      <path d="M582 808 L628 760 L662 796 L686 774 L746 828 L746 818 Q746 832 732 832 L596 832 Q582 832 582 818 Z" fill="#4f7a4a" stroke="none"/>
      <circle cx="716" cy="742" r="13" fill="#f4d27a" stroke="none"/>
      <rect x="582" y="850" width="146" height="15" rx="7" fill="#e3d6c1" stroke="none"/>
      <rect x="582" y="876" width="106" height="15" rx="7" fill="#e3d6c1" stroke="none"/>
      <rect x="582" y="930" width="164" height="56" rx="28" fill="#c64b3f" stroke="none"/>
      <path d="M664 974 L664 948 M651 960 L664 947 L677 960" fill="none" stroke="#ffffff" stroke-width="9"/>
    </g>

    <!-- hands on the phone -->
    <circle cx="560" cy="900" r="42" fill="#f6caa5"/>
    <circle cx="790" cy="870" r="42" fill="#f6caa5"/>

    <!-- going out: hearts and a sparkle -->
    <path d="M846 590 c-26-30-74-8-60 30 c10 26 60 56 60 56 s50-30 60-56 c14-38-34-60-60-30 z" fill="#e8766a"/>
    <path d="M880 444 c-16-18-46-5-37 18 c6 16 37 34 37 34 s31-18 37-34 c9-23-21-36-37-18 z" fill="#f6c9c2" stroke-width="9"/>
    <path d="M870 200 l12 34 l34 12 l-34 12 l-12 34 l-12-34 l-34-12 l34-12 z" fill="#f4d27a" stroke-width="9"/>
  </g>
</svg>
